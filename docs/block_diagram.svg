<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="860" height="270" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- core boundary -->
  <rect x="95" y="20" width="670" height="190" rx="8" fill="none" stroke="#999" stroke-dasharray="6 4"/>
  <text x="105" y="40" fill="#666">nmea_core</text>

  <!-- blocks -->
  <g fill="#eef4fb" stroke="#2b5d8a" stroke-width="1.5">
    <rect x="120" y="60" width="100" height="60" rx="6"/>
    <rect x="260" y="60" width="130" height="60" rx="6"/>
    <rect x="430" y="60" width="130" height="60" rx="6"/>
    <rect x="600" y="60" width="140" height="60" rx="6"/>
    <rect x="260" y="150" width="130" height="45" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#1d3b57">
    <text x="170" y="86" font-weight="bold">uart_rx</text>
    <text x="170" y="104" font-size="11">8N1, 2-FF sync</text>
    <text x="325" y="86" font-weight="bold">nmea_parser</text>
    <text x="325" y="104" font-size="11">framing, checksum</text>
    <text x="495" y="86" font-weight="bold">nmea_fifo</text>
    <text x="495" y="104" font-size="11">commit / abort</text>
    <text x="670" y="86" font-weight="bold">CR→CRLF + uart_tx</text>
    <text x="670" y="104" font-size="11">only good sentences</text>
    <text x="325" y="170" font-weight="bold">dec_accum</text>
    <text x="325" y="186" font-size="11">ASCII → fixed point</text>
  </g>

  <!-- arrows -->
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="30" y1="90" x2="118" y2="90"/>
    <line x1="220" y1="90" x2="258" y2="90"/>
    <line x1="390" y1="90" x2="428" y2="90"/>
    <line x1="560" y1="90" x2="598" y2="90"/>
    <line x1="740" y1="90" x2="830" y2="90"/>
    <line x1="325" y1="120" x2="325" y2="148"/>
    <path d="M390 172 H470 V240 H520"/>
    <path d="M325 122 V130 H200 V240 H170" stroke-dasharray="4 3"/>
  </g>
  <g fill="#333" font-size="12">
    <text x="30" y="80">rx (pin 40)</text>
    <text x="770" y="80">tx (pin 39)</text>
    <text x="230" y="82" font-size="11">byte</text>
    <text x="395" y="82" font-size="11">wr</text>
    <text x="525" y="236">RMC / HDT / DPT registers</text>
    <text x="525" y="252" font-size="11" fill="#666">updated only after a good checksum</text>
    <text x="40" y="236">ok / err pulses,</text>
    <text x="40" y="252">counters → LED (pin 10)</text>
  </g>
</svg>
